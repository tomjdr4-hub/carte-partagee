name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer module.json pour cette version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Construire module.zip
        run: zip -r module.zip module.json README.md scripts styles templates

      - name: Publier les fichiers sur la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" module.json module.zip --clobber
